name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nichigo_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nichigo_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://localhost:5432/nichigo
      DB_USERNAME: nichigo_ci
      DB_PASSWORD: nichigo_ci_test_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nichigo
          POSTGRES_USER: nichigo_ci
          POSTGRES_PASSWORD: nichigo_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nichigo_ci -d nichigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: nichigo_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: nichigo_backend/pom.xml

      - name: Run tests
        run: bash ./mvnw test --no-transfer-progress

      - name: Verify build
        run: bash ./mvnw verify -DskipTests --no-transfer-progress
