# nichigo-api — application configuration
#
# Secrets and environment-specific values come from environment variables.
# See nichigo_backend/.env.example for the full list.
# Never commit real values to source control.

spring:
  application:
    name: nichigo-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

# Guest credential is independent of the 30-minute Auth/CSRF SESSION.
# Configure Secure and SameSite for the actual HTTPS/frontend topology.
nichigo:
  stroke:
    storage-root: ${STROKE_STORAGE_ROOT:}
  guest:
    cookie:
      secure: ${GUEST_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
      same-site: ${GUEST_COOKIE_SAME_SITE:${SESSION_COOKIE_SAME_SITE:Lax}}
      domain: ${GUEST_COOKIE_DOMAIN:}

# CORS allowed origins (comma-separated). Override in environment.
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

# Spring Actuator: only /actuator/health is exposed publicly.
# Details are never shown externally (avoids leaking infrastructure info).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.nichigo: DEBUG
