name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nichigo_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nichigo_frontend/package-lock.json

      - name: Agent skills drift check
        working-directory: .
        run: node scripts/sync-agent-skills.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: nichigo_ci
      DB_PASSWORD: nichigo_ci_test_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nichigo
          POSTGRES_USER: nichigo_ci
          POSTGRES_PASSWORD: nichigo_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nichigo_ci -d nichigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: nichigo_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: nichigo_backend/pom.xml

      - name: Create isolated test schema
        run: |
          schema="jpn021_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          docker exec -e PGPASSWORD="$DB_PASSWORD" "${{ job.services.postgres.id }}" \
            psql -h 127.0.0.1 -U "$DB_USERNAME" -d nichigo -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA \"$schema\""
          echo "JPN021_TEST_SCHEMA=$schema" >> "$GITHUB_ENV"
          echo "DB_URL=jdbc:postgresql://localhost:5432/nichigo?currentSchema=$schema" >> "$GITHUB_ENV"

      - name: Run tests
        run: bash ./mvnw test --no-transfer-progress

      - name: Verify Linux stroke symlink test ran
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path('target/surefire-reports/TEST-com.nichigo.api.content.StrokeAssetSecurityTest.xml')
          assert report.is_file(), 'StrokeAssetSecurityTest Surefire report is missing'
          suite = ET.parse(report).getroot()
          matches = [case for case in suite.findall('testcase')
                     if case.get('name') == 'rejectsParentAndTargetSymlinks']
          assert len(matches) == 1, 'Linux symlink test was not discovered exactly once'
          case = matches[0]
          assert case.find('skipped') is None, 'Linux symlink test was skipped'
          assert case.find('failure') is None and case.find('error') is None, 'Linux symlink test failed'
          print('Linux stroke symlink test PASS (executed, not skipped)')
          with open(pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as summary:
              summary.write('Linux stroke symlink test: **PASS (executed, not skipped)**\n')
          PY

      - name: Verify build
        run: bash ./mvnw verify -DskipTests --no-transfer-progress

      - name: Drop isolated test schema
        if: always()
        run: |
          schema="jpn021_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [[ "${JPN021_TEST_SCHEMA:-}" == "$schema" ]]; then
            docker exec -e PGPASSWORD="$DB_PASSWORD" "${{ job.services.postgres.id }}" \
              psql -h 127.0.0.1 -U "$DB_USERNAME" -d nichigo -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA \"$schema\" CASCADE"
          fi
